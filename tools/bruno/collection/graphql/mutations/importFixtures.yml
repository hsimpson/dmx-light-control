info:
  name: importFixtures
  type: graphql
  seq: 7

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($document: ImportFixturesInput!) {
        importFixtures(document: $document) {
          fixtures {
            createdAt
            fixtureChannelDefinitions {
              createdAt
              fixtureChannelAssignments {
                channelNumber
                createdAt
                fixtureChannelDefinition
                publicId
                updatedAt
              }
              fixtureChannelRanges {
                createdAt
                description
                dmxEnd
                dmxStart
                publicId
                updatedAt
              }
              name
              order
              preset
              publicId
              updatedAt
            }
            fixtureChannelModes {
              createdAt
              fixtureChannelAssignments {
                channelNumber
                createdAt
                fixtureChannelDefinition
                publicId
                updatedAt
              }
              name
              order
              publicId
              updatedAt
            }
            fixtureVendor {
              createdAt
              name
              publicId
              updatedAt
            }
            name
            publicId
            updatedAt
          }
          importedCount
        }
      }
    variables: |
      {
        "document": {
          "fixtures": [],
          "schemaVersion": null,
          "vendors": []
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
