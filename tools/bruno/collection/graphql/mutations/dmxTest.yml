info:
  name: dmxTest
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($channelValues: ChannelValuesInput!) {
        dmxTest(channelValues: $channelValues)
      }
    variables: |
      {
        "channelValues": {
          "dmxValues": []
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
