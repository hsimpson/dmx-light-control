info:
  name: openPorts
  type: graphql
  seq: 10

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($openPortsDto: OpenPortsInput!) {
        openPorts(openPortsDto: $openPortsDto)
      }
    variables: |
      {
        "openPortsDto": {
          "inputPort": {
            "literal": {
              "kind": "IntValue",
              "value": "1",
              "loc": {
                "start": 0,
                "end": 1
              }
            }
          },
          "outputPort": {
            "literal": {
              "kind": "IntValue",
              "value": "1",
              "loc": {
                "start": 0,
                "end": 1
              }
            }
          }
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
