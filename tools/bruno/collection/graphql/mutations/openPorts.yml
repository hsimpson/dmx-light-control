info:
  name: openPorts
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($openPortsDto: OpenPortsInput!) {
        openPorts(openPortsDto: $openPortsDto)
      }
    variables: |
      {
        "openPortsDto": {
          "inputPort": null,
          "outputPort": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
