info:
  name: updateFixture
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  body:
    query: |
      mutation($input: UpdateFixtureInput!) {
        updateFixture(input: $input) {
          fixtureVendor {
            createdAt
            name
            publicId
            updatedAt
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "name": "Mega TriPar Profile Plus",
          "publicId": "aadb2d60-4a8e-45c3-b58a-8726861930b1",
          "vendorName": null,
          "vendorPublicId": null
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
