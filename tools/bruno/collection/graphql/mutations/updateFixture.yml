info:
  name: updateFixture
  type: graphql
  seq: 14

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: UpdateFixtureInput!) {
        updateFixture(input: $input) {
          createdAt
          fixtureChannelDefinitions {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              fixtureChannelDefinition {
                createdAt
                fixtureChannelAssignments
                fixtureChannelRanges
                name
                order
                preset
                publicId
                updatedAt
              }
              publicId
              updatedAt
            }
            fixtureChannelRanges {
              createdAt
              description
              dmxEnd
              dmxStart
              publicId
              updatedAt
            }
            name
            order
            preset
            publicId
            updatedAt
          }
          fixtureChannelModes {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              fixtureChannelDefinition {
                createdAt
                fixtureChannelAssignments
                fixtureChannelRanges
                name
                order
                preset
                publicId
                updatedAt
              }
              publicId
              updatedAt
            }
            name
            order
            publicId
            updatedAt
          }
          fixtureVendor {
            createdAt
            name
            publicId
            updatedAt
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "channelDefinitions": [],
          "channelModes": [],
          "name": null,
          "publicId": null,
          "vendor": {
            "name": null,
            "publicId": null
          }
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
