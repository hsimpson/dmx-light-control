info:
  name: updateFixture
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: FixtureInput!) {
        updateFixture(input: $input) {
          createdAt
          fixtureChannelDefinitions {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              publicId
              updatedAt
            }
            fixtureChannelRanges {
              createdAt
              description
              dmxEnd
              dmxStart
              publicId
              updatedAt
            }
            name
            order
            preset
            publicId
            updatedAt
          }
          fixtureChannelModes {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              publicId
              updatedAt
            }
            name
            order
            publicId
            updatedAt
          }
          fixtureVendor {
            createdAt
            name
            publicId
            updatedAt
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "fixtureChannelDefinitions": [],
          "fixtureChannelModes": [],
          "name": null,
          "publicId": null,
          "vendorId": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
