info:
  name: updateProject
  type: graphql
  seq: 13

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: UpdateProjectInput!) {
        updateProject(input: $input) {
          createdAt
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "name": null,
          "publicId": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
