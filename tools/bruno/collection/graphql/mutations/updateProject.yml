info:
  name: updateProject
  type: graphql
  seq: 17

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: UpdateProjectInput!) {
        updateProject(input: $input) {
          createdAt
          environmentType
          name
          project3dObjects {
            createdAt
            name
            publicId
            sceneObjectType {
              createdAt
              defaultSizeX
              defaultSizeY
              defaultSizeZ
              geometryKind
              isScalable
              modelPath
              name
              publicId
              updatedAt
            }
            sizeX
            sizeY
            sizeZ
            transform
            updatedAt
          }
          projectFixtures {
            channelMode {
              createdAt
              fixtureChannelAssignments {
                channelNumber
                fixtureChannelDefinition
              }
              name
              publicId
              updatedAt
            }
            createdAt
            fixture {
              createdAt
              fixtureVendor {
                createdAt
                name
                publicId
                updatedAt
              }
              model3dPath
              name
              publicId
              updatedAt
            }
            publicId
            startAddress
            transform
            updatedAt
          }
          publicId
          roomHeight
          roomLength
          roomWidth
          updatedAt
          virtualConsole {
            height
            pages {
              controls {
                backgroundColor
                borderColor
                borderWidth
                children
                fontFamily
                fontSize
                fontWeight
                foregroundColor
                height
                id
                label
                orientation
                type
                valueType
                width
                x
                y
              }
              id
              name
            }
            schemaVersion
            snap
            width
          }
        }
      }
    variables: |
      {
        "input": {
          "environmentType": null,
          "name": null,
          "publicId": null,
          "roomHeight": null,
          "roomLength": null,
          "roomWidth": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
