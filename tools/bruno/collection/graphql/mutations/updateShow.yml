info:
  name: updateShow
  type: graphql
  seq: 33

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: UpdateShowInput!) {
        updateShow(input: $input) {
          audioClips {
            beatsMs
            createdAt
            durationMs
            fileName
            peaks
            publicId
            startMs
            updatedAt
          }
          beatsMs
          createdAt
          durationMs
          lightTracks {
            clips {
              durationMs
              followBeat
              functionPublicId
              id
              startMs
            }
            id
            name
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "audioClips": [],
          "lightTracks": [],
          "name": null,
          "publicId": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
