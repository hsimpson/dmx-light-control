info:
  name: addProjectFunction
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: AddProjectFunctionInput!) {
        addProjectFunction(input: $input) {
          createdAt
          name
          publicId
          sequence {
            direction
            fixturePublicIds
            runOrder
            steps {
              dmxValues {
                channel
                value
              }
              fadeIn
              fadeOut
              hold
            }
          }
          type
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "name": null,
          "projectPublicId": null,
          "sequence": {
            "direction": null,
            "fixturePublicIds": [],
            "runOrder": null,
            "steps": []
          },
          "type": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
