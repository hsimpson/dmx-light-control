info:
  name: createFixtureVendor
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: CreateFixtureVendorInput!) {
        createFixtureVendor(input: $input) {
          createdAt
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "name": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
