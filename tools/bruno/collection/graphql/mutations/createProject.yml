info:
  name: createProject
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: CreateProjectInput!) {
        createProject(input: $input) {
          createdAt
          name
          projectFixtures {
            channelMode {
              createdAt
              fixtureChannelAssignments {
                channelNumber
                fixtureChannelDefinition
              }
              name
              publicId
              updatedAt
            }
            createdAt
            fixture {
              createdAt
              fixtureVendor {
                createdAt
                name
                publicId
                updatedAt
              }
              name
              publicId
              updatedAt
            }
            publicId
            startAddress
            updatedAt
          }
          publicId
          roomHeight
          roomLength
          roomWidth
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "name": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
