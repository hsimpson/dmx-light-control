info:
  name: importProjects
  type: graphql
  seq: 13

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($document: ImportProjectsInput!) {
        importProjects(document: $document) {
          importedCount
          projects {
            createdAt
            environmentType
            name
            project3dObjects {
              createdAt
              name
              publicId
              sceneObjectType {
                createdAt
                defaultSizeX
                defaultSizeY
                defaultSizeZ
                geometryKind
                isScalable
                modelPath
                name
                publicId
                updatedAt
              }
              sizeX
              sizeY
              sizeZ
              transform
              updatedAt
            }
            projectFixtures {
              channelMode {
                createdAt
                fixtureChannelAssignments
                name
                publicId
                updatedAt
              }
              createdAt
              fixture {
                createdAt
                fixtureVendor
                name
                publicId
                updatedAt
              }
              publicId
              startAddress
              updatedAt
            }
            publicId
            roomHeight
            roomLength
            roomWidth
            updatedAt
            virtualConsole {
              height
              pages {
                controls
                id
                name
              }
              schemaVersion
              width
            }
          }
        }
      }
    variables: |
      {
        "document": {
          "projects": [],
          "schemaVersion": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
