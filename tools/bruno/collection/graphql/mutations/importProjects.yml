info:
  name: importProjects
  type: graphql
  seq: 11

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($document: ImportProjectsInput!) {
        importProjects(document: $document) {
          importedCount
          projects {
            createdAt
            name
            projectFixtures {
              channelMode {
                createdAt
                fixtureChannelAssignments
                name
                publicId
                updatedAt
              }
              createdAt
              fixture {
                createdAt
                fixtureVendor
                name
                publicId
                updatedAt
              }
              publicId
              startAddress
              updatedAt
            }
            publicId
            roomHeight
            roomLength
            roomWidth
            updatedAt
          }
        }
      }
    variables: |
      {
        "document": {
          "projects": [],
          "schemaVersion": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
