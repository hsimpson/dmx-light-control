info:
  name: importProjects
  type: graphql
  seq: 19

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($document: ImportProjectsInput!) {
        importProjects(document: $document) {
          importedCount
          projects {
            createdAt
            environmentType
            ioDevices {
              kind
              manufacturer
              midiMappingPublicId
              name
              productId
              serial
              usbLocation
              vendorId
            }
            name
            project3dObjects {
              createdAt
              name
              publicId
              sceneObjectType {
                createdAt
                defaultSizeX
                defaultSizeY
                defaultSizeZ
                geometryKind
                isScalable
                modelPath
                name
                publicId
                updatedAt
              }
              sizeX
              sizeY
              sizeZ
              transform
              updatedAt
            }
            projectFixtures {
              channelMode {
                createdAt
                fixtureChannelAssignments
                name
                publicId
                updatedAt
              }
              createdAt
              fixture {
                beamAngle
                createdAt
                fixtureVendor
                model3dPath
                name
                publicId
                updatedAt
              }
              publicId
              startAddress
              transform
              updatedAt
            }
            projectFunctions {
              createdAt
              name
              publicId
              sequence {
                direction
                fixturePublicIds
                runOrder
                steps
              }
              type
              updatedAt
            }
            publicId
            roomHeight
            roomLength
            roomWidth
            updatedAt
            virtualConsole {
              height
              pages {
                controls
                id
                name
              }
              schemaVersion
              snap
              width
            }
          }
        }
      }
    variables: |
      {
        "document": {
          "projects": [],
          "schemaVersion": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
