info:
  name: addShow
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: AddShowInput!) {
        addShow(input: $input) {
          audioClips {
            beatsMs
            createdAt
            durationMs
            fileName
            peaks
            publicId
            startMs
            updatedAt
          }
          beatsMs
          createdAt
          durationMs
          lightTracks {
            clips {
              durationMs
              followBeat
              functionPublicId
              id
              startMs
            }
            id
            name
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "input": {
          "name": null,
          "projectPublicId": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
