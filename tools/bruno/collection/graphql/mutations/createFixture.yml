info:
  name: createFixture
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($input: CreateFixtureInput!) {
        createFixture(input: $input) {
          createdAt
          fixtureChannelDefinitions {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              fixtureChannelDefinition {
                createdAt
                fixtureChannelAssignments
                fixtureChannelRanges
                name
                order
                preset
                publicId
                updatedAt
              }
              publicId
              updatedAt
            }
            fixtureChannelRanges {
              createdAt
              description
              dmxEnd
              dmxStart
              publicId
              updatedAt
            }
            name
            order
            preset
            publicId
            updatedAt
          }
          fixtureChannelModes {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              fixtureChannelDefinition {
                createdAt
                fixtureChannelAssignments
                fixtureChannelRanges
                name
                order
                preset
                publicId
                updatedAt
              }
              publicId
              updatedAt
            }
            name
            order
            publicId
            updatedAt
          }
          fixtureVendor {
            createdAt
            name
            publicId
            updatedAt
          }
          height
          length
          model3dPath
          name
          picture2dPath
          picturePath
          publicId
          updatedAt
          weight
          width
        }
      }
    variables: |
      {
        "input": {
          "channelDefinitions": [],
          "channelModes": [],
          "height": null,
          "length": null,
          "name": null,
          "vendor": {
            "name": null,
            "publicId": null
          },
          "weight": null,
          "width": null
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
