info:
  name: setChannelValues
  type: graphql
  seq: 15

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      mutation($channelValues: ChannelValuesInput!) {
        setChannelValues(channelValues: $channelValues)
      }
    variables: |
      {
        "channelValues": {
          "dmxValues": [
            {
              "channel": 1,
              "value": 127
            }
          ]
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
