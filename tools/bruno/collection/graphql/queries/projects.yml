info:
  name: projects
  type: graphql
  seq: 8

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        projects {
          createdAt
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
