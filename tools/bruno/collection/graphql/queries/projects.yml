info:
  name: projects
  type: graphql
  seq: 9

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        projects {
          createdAt
          environmentType
          ioDevices {
            kind
            manufacturer
            name
            productId
            serial
            usbLocation
            vendorId
          }
          name
          project3dObjects {
            createdAt
            name
            publicId
            sceneObjectType {
              createdAt
              defaultSizeX
              defaultSizeY
              defaultSizeZ
              geometryKind
              isScalable
              modelPath
              name
              publicId
              updatedAt
            }
            sizeX
            sizeY
            sizeZ
            transform
            updatedAt
          }
          projectFixtures {
            channelMode {
              createdAt
              fixtureChannelAssignments {
                channelNumber
                fixtureChannelDefinition
                publicId
              }
              name
              publicId
              updatedAt
            }
            createdAt
            fixture {
              beamAngle
              createdAt
              fixtureVendor {
                createdAt
                name
                publicId
                updatedAt
              }
              model3dPath
              name
              publicId
              updatedAt
            }
            publicId
            startAddress
            transform
            updatedAt
          }
          projectFunctions {
            createdAt
            name
            publicId
            sequence {
              direction
              fixturePublicIds
              runOrder
              steps {
                dmxValues
                fadeIn
                fadeOut
                hold
              }
            }
            type
            updatedAt
          }
          publicId
          roomHeight
          roomLength
          roomWidth
          updatedAt
          virtualConsole {
            height
            pages {
              controls {
                backgroundColor
                borderColor
                borderWidth
                buttonMode
                channelBindings
                children
                fontFamily
                fontSize
                fontWeight
                foregroundColor
                functionName
                functionPublicId
                height
                id
                label
                lowerLimit
                orientation
                type
                upperLimit
                valueType
                width
                x
                y
              }
              id
              name
            }
            schemaVersion
            snap
            width
          }
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
