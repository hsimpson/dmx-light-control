info:
  name: projects
  type: graphql
  seq: 8

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        projects {
          createdAt
          name
          projectFixtures {
            channelMode {
              createdAt
              fixtureChannelAssignments {
                channelNumber
                fixtureChannelDefinition
              }
              name
              publicId
              updatedAt
            }
            createdAt
            fixture {
              createdAt
              fixtureVendor {
                createdAt
                name
                publicId
                updatedAt
              }
              name
              publicId
              updatedAt
            }
            publicId
            startAddress
            updatedAt
          }
          publicId
          updatedAt
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
