info:
  name: fixture
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query($fixtureId: UUID!) {
        fixture(fixtureId: $fixtureId) {
          createdAt
          fixtureChannelDefinitions {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              publicId
              updatedAt
            }
            name
            preset
            publicId
            updatedAt
          }
          fixtureChannelModes {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              publicId
              updatedAt
            }
            name
            publicId
            updatedAt
          }
          fixtureVendor {
            createdAt
            name
            publicId
            updatedAt
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "fixtureId": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
