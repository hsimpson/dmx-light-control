info:
  name: fixture
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query($fixtureId: UUID!) {
        fixture(fixtureId: $fixtureId) {
          channelAssignments {
            channelMode
            channels {
              channelNumber
              createdAt
              externalId
              preset
              updatedAt
            }
          }
          createdAt
          externalId
          name
          updatedAt
          vendor {
            createdAt
            externalId
            name
            updatedAt
          }
        }
      }
    variables: |
      {
        "fixtureId": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
