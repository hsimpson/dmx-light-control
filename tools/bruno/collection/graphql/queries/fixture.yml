info:
  name: fixture
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query($externalId: UUID!) {
        fixture(externalId: $externalId) {
          channelAssignments {
            channelMode
            channelNumber
            createdAt
            externalId
            preset
            updatedAt
          }
          createdAt
          externalId
          name
          updatedAt
          vendor {
            createdAt
            externalId
            name
            updatedAt
          }
        }
      }
    variables: |
      {
        "externalId": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
