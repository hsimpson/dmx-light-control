info:
  name: project
  type: graphql
  seq: 7

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query($publicId: UUID!) {
        project(publicId: $publicId) {
          createdAt
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "publicId": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
