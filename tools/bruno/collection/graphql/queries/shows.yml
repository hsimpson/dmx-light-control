info:
  name: shows
  type: graphql
  seq: 14

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query($projectPublicId: UUID!) {
        shows(projectPublicId: $projectPublicId) {
          audioClips {
            beatsMs
            createdAt
            durationMs
            fileName
            peaks
            publicId
            startMs
            updatedAt
          }
          beatsMs
          createdAt
          cues {
            id
            ms
            name
          }
          durationMs
          lightTracks {
            clips {
              durationMs
              followBeat
              functionPublicId
              id
              startMs
            }
            id
            name
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "projectPublicId": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
