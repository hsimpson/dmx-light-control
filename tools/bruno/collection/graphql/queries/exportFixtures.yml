info:
  name: exportFixtures
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        exportFixtures {
          fixtures {
            channelDefinitions {
              createdAt
              name
              order
              preset
              publicId
              ranges {
                createdAt
                description
                dmxEnd
                dmxStart
                publicId
                updatedAt
              }
              updatedAt
            }
            channelModes {
              assignments {
                channelDefinitionPublicId
                channelNumber
                createdAt
                updatedAt
              }
              createdAt
              name
              order
              publicId
              updatedAt
            }
            createdAt
            height
            length
            model3dPath
            name
            picture2dPath
            picturePath
            publicId
            updatedAt
            vendor {
              createdAt
              name
              publicId
              updatedAt
            }
            weight
            width
          }
          schemaVersion
          vendors {
            createdAt
            name
            publicId
            updatedAt
          }
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
