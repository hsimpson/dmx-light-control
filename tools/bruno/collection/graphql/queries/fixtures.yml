info:
  name: fixtures
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        fixtures {
          channelAssignments {
            channelMode
            channels {
              channelNumber
              createdAt
              externalId
              preset
              updatedAt
            }
          }
          createdAt
          externalId
          name
          updatedAt
          vendor {
            createdAt
            externalId
            name
            updatedAt
          }
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
