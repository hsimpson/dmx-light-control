info:
  name: fixtures
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        fixtures {
          createdAt
          fixtureChannelDefinitions {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              publicId
              updatedAt
            }
            fixtureChannelRanges {
              createdAt
              description
              dmxEnd
              dmxStart
              publicId
              updatedAt
            }
            name
            preset
            publicId
            updatedAt
          }
          fixtureChannelModes {
            createdAt
            fixtureChannelAssignments {
              channelNumber
              createdAt
              publicId
              updatedAt
            }
            name
            publicId
            updatedAt
          }
          fixtureVendor {
            createdAt
            name
            publicId
            updatedAt
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
