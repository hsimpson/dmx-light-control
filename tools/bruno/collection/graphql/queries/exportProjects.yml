info:
  name: exportProjects
  type: graphql
  seq: 2

graphql:
  method: POST
  url: '{{backendUrl}}/graphql'
  auth: inherit
  body:
    query: |
      query {
        exportProjects {
          projects {
            createdAt
            environmentType
            name
            project3dObjects {
              createdAt
              name
              publicId
              sceneObjectTypePublicId
              sizeX
              sizeY
              sizeZ
              transform
              updatedAt
            }
            projectFixtures {
              channelModePublicId
              createdAt
              fixturePublicId
              publicId
              startAddress
              updatedAt
            }
            publicId
            roomHeight
            roomLength
            roomWidth
            updatedAt
          }
          schemaVersion
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
