info:
  name: exportProjects
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        exportProjects {
          projects {
            name
            publicId
          }
          schemaVersion
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
