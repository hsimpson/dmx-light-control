info:
  name: getMidiDevices
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        getMidiDevices {
          inputDevices {
            name
            port
          }
          outputDevices {
            name
            port
          }
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
