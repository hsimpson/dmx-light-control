info:
  name: ioDevices
  type: graphql
  seq: 7

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        ioDevices {
          kind
          manufacturer
          name
          productId
          serial
          status
          usbLocation
          vendorId
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
