info:
  name: midiMapping
  type: graphql
  seq: 9

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query($publicId: UUID!) {
        midiMapping(publicId: $publicId) {
          createdAt
          entries {
            channel
            controlType
            createdAt
            feedback {
              monitor {
                behavior
                color
              }
              off {
                behavior
                color
              }
              on {
                behavior
                color
              }
            }
            ledType
            messageType
            name
            number
            publicId
            updatedAt
          }
          ledPalettes {
            rgb {
              behaviors {
                hex
                name
                value
              }
              colors {
                hex
                name
                value
              }
            }
            single {
              behaviors {
                hex
                name
                value
              }
              colors {
                hex
                name
                value
              }
            }
          }
          name
          publicId
          updatedAt
        }
      }
    variables: |
      {
        "publicId": null
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
