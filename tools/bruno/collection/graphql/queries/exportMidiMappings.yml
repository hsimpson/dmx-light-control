info:
  name: exportMidiMappings
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{backendUrl}}/graphql"
  auth: inherit
  body:
    query: |
      query {
        exportMidiMappings {
          mappings {
            createdAt
            entries {
              channel
              controlType
              createdAt
              feedback {
                monitor
                off
                on
              }
              ledType
              messageType
              name
              number
              publicId
              updatedAt
            }
            ledPalettes {
              rgb {
                behaviors
                colors
              }
              single {
                behaviors
                colors
              }
            }
            name
            publicId
            updatedAt
          }
          schemaVersion
        }
      }
    variables: |
      {}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
