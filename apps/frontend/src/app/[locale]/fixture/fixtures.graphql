fragment FixtureChannelAssignmentFields on FixtureChannelAssignmentDto {
  publicId
  channelNumber
  fixtureChannelDefinition {
    publicId
    name
    order
    preset
    fixtureChannelRanges {
      ...FixtureChannelRangeFields
    }
    createdAt
    updatedAt
  }
  createdAt
  updatedAt
}

fragment FixtureChannelRangeFields on FixtureChannelRangeDto {
  publicId
  dmxStart
  dmxEnd
  description
  createdAt
  updatedAt
}

fragment FixtureChannelDefinitionFields on FixtureChannelDefinitionDto {
  publicId
  name
  order
  preset
  fixtureChannelRanges {
    ...FixtureChannelRangeFields
  }
  createdAt
  updatedAt
}

fragment FixtureChannelModeFields on FixtureChannelModeDto {
  publicId
  name
  order
  fixtureChannelAssignments {
    ...FixtureChannelAssignmentFields
  }
  createdAt
  updatedAt
}

fragment FixtureFields on FixtureDto {
  publicId
  name

  fixtureChannelDefinitions {
    ...FixtureChannelDefinitionFields
  }

  fixtureChannelModes {
    ...FixtureChannelModeFields
  }

  fixtureVendor {
    ...VendorFields
  }

  createdAt
  updatedAt
}

query GetFixtures {
  fixtures {
    ...FixtureFields
  }
}

query GetFixture($publicId: UUID!) {
  fixture(publicId: $publicId) {
    ...FixtureFields
  }
}

mutation UpdateFixture($input: UpdateFixtureInput!) {
  updateFixture(input: $input) {
    ...FixtureFields
  }
}

mutation DeleteFixture($publicId: UUID!) {
  deleteFixture(publicId: $publicId) {
    publicId
    deleted
  }
}

query ExportFixtures {
  exportFixtures {
    schemaVersion
    vendors {
      publicId
      name
    }
    fixtures {
      publicId
      name
      vendor {
        publicId
        name
      }
      channelDefinitions {
        publicId
        name
        order
        preset
        ranges {
          publicId
          dmxStart
          dmxEnd
          description
        }
      }
      channelModes {
        publicId
        name
        order
        assignments {
          channelNumber
          channelDefinitionPublicId
        }
      }
    }
  }
}

mutation ImportFixtures($document: ImportFixturesInput!) {
  importFixtures(document: $document) {
    importedCount
    fixtures {
      ...FixtureFields
    }
  }
}
