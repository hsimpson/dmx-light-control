fragment VendorFields on FixtureVendorDto {
  publicId
  name
  createdAt
  updatedAt
}

query GetFixtureVendors {
  fixtureVendors {
    ...VendorFields
  }
}

mutation DeleteFixtureVendor($publicId: UUID!) {
  deleteFixtureVendor(publicId: $publicId) {
    publicId
    deleted
  }
}

mutation CreateFixtureVendor($name: String!) {
  createFixtureVendor(input: { name: $name }) {
    ...VendorFields
  }
}
