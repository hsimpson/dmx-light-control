fragment ProjectFields on ProjectDto {
  publicId
  name
  environmentType
  roomWidth
  roomLength
  roomHeight
  createdAt
  updatedAt
}

fragment VirtualConsoleControlFields on VirtualConsoleControlDto {
  id
  type
  x
  y
  width
  height
  label
  backgroundColor
  borderWidth
  borderColor
  orientation
  foregroundColor
  valueType
}

fragment VirtualConsoleFields on VirtualConsoleDto {
  schemaVersion
  width
  height
  pages {
    id
    name
    controls {
      ...VirtualConsoleControlFields
      children {
        ...VirtualConsoleControlFields
        children {
          ...VirtualConsoleControlFields
          children {
            ...VirtualConsoleControlFields
            children {
              ...VirtualConsoleControlFields
              children {
                ...VirtualConsoleControlFields
                children {
                  ...VirtualConsoleControlFields
                  children {
                    ...VirtualConsoleControlFields
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment ProjectFixtureFields on ProjectFixtureDto {
  publicId
  startAddress
  fixture {
    publicId
    name
    fixtureVendor {
      publicId
      name
    }
  }
  channelMode {
    publicId
    name
    fixtureChannelAssignments {
      channelNumber
      fixtureChannelDefinition {
        preset
      }
    }
  }
  createdAt
  updatedAt
}

fragment Project3dObjectFields on Project3dObjectDto {
  publicId
  name
  sizeX
  sizeY
  sizeZ
  transform
  sceneObjectType {
    publicId
    name
    geometryKind
    modelPath
    isScalable
    defaultSizeX
    defaultSizeY
    defaultSizeZ
    createdAt
    updatedAt
  }
  createdAt
  updatedAt
}

query GetSceneObjectTypes {
  sceneObjectTypes {
    publicId
    name
    geometryKind
    modelPath
    isScalable
    defaultSizeX
    defaultSizeY
    defaultSizeZ
    createdAt
    updatedAt
  }
}

query GetProjects {
  projects {
    ...ProjectFields
  }
}

query GetProject($publicId: UUID!) {
  project(publicId: $publicId) {
    ...ProjectFields
    virtualConsole {
      ...VirtualConsoleFields
    }
    projectFixtures {
      ...ProjectFixtureFields
    }
    project3dObjects {
      ...Project3dObjectFields
    }
  }
}

mutation CreateProject($name: String!) {
  createProject(input: { name: $name }) {
    ...ProjectFields
  }
}

mutation UpdateProject($input: UpdateProjectInput!) {
  updateProject(input: $input) {
    ...ProjectFields
  }
}

mutation UpdateProjectVirtualConsole($input: UpdateProjectVirtualConsoleInput!) {
  updateProjectVirtualConsole(input: $input) {
    ...ProjectFields
  }
}

mutation DeleteProject($publicId: UUID!) {
  deleteProject(publicId: $publicId) {
    publicId
    deleted
  }
}

mutation AddProjectFixture($input: AddProjectFixtureInput!) {
  addProjectFixture(input: $input) {
    ...ProjectFixtureFields
  }
}

mutation UpdateProjectFixture($input: UpdateProjectFixtureInput!) {
  updateProjectFixture(input: $input) {
    ...ProjectFixtureFields
  }
}

mutation DeleteProjectFixture($publicId: UUID!) {
  deleteProjectFixture(publicId: $publicId) {
    publicId
    deleted
  }
}

mutation AddProject3dObject($input: AddProject3dObjectInput!) {
  addProject3dObject(input: $input) {
    ...Project3dObjectFields
  }
}

mutation UpdateProject3dObject($input: UpdateProject3dObjectInput!) {
  updateProject3dObject(input: $input) {
    ...Project3dObjectFields
  }
}

mutation DeleteProject3dObject($publicId: UUID!) {
  deleteProject3dObject(publicId: $publicId) {
    publicId
    deleted
  }
}

query ExportProjects {
  exportProjects {
    schemaVersion
    projects {
      publicId
      name
      environmentType
      roomWidth
      roomLength
      roomHeight
      createdAt
      updatedAt
      projectFixtures {
        publicId
        startAddress
        fixturePublicId
        channelModePublicId
        createdAt
        updatedAt
      }
      project3dObjects {
        publicId
        name
        sceneObjectTypePublicId
        sceneObjectTypeName
        sizeX
        sizeY
        sizeZ
        transform
        createdAt
        updatedAt
      }
      virtualConsole {
        ...VirtualConsoleFields
      }
    }
  }
}

mutation ImportProjects($document: ImportProjectsInput!) {
  importProjects(document: $document) {
    importedCount
    projects {
      ...ProjectFields
    }
  }
}
